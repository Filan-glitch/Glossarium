name: glossarium
description: "Eine Sammlung von Abkürzungen und Fachbegriffen"
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  cloud_firestore: ^6.0.3
  file_picker: ^10.3.3
  firebase_auth: ^6.1.1
  firebase_core: ^4.2.0
  firebase_ui_auth: ^3.0.0
  firebase_ui_oauth_google: ^2.0.0
  flutter_redux: ^0.10.0
  google_sign_in: ^6.3.0
  open_filex: ^4.7.0
  path: ^1.9.1
  path_provider: ^2.1.5
  pdf: ^3.11.3
  redux: ^5.0.0
  share_plus: ^12.0.0
  sqflite: ^2.4.2
  intl: any

dev_dependencies:
  flutter_lints: ^6.0.0
  icons_launcher: ^3.0.3

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/fonts/